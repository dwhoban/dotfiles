# External work configuration.
# Cloned to ~/.config/work on work machines only; pulled manually with `chezmoi -R apply`.
{{ if and .work .workRepoURL }}
[".config/work"]
    type = "git-repo"
    url = {{ .workRepoURL | quote }}
    refreshPeriod = "0"

    [".config/work".pull]
        args = ["--ff-only"]
{{ end }}
